<div class="container py-4">
  <h1 class="mb-4">Carrito de compras</h1>

  <div *ngIf="cartItems.length === 0" class="alert alert-info">
    Tu carrito está vacío.
  </div>

  <div *ngIf="cartItems.length > 0">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Producto</th>
            <th class="text-center">Cantidad</th>
            <th class="text-end">Precio</th>
            <th class="text-end">Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems">
            <td>
              <div class="d-flex align-items-center gap-3">
                <img
                  [src]="item.image || 'assets/images/product/placeholder.png'"
                  alt="{{ item.title }}"
                  style="width:60px;height:60px;object-fit:cover;border-radius:6px;"
                />
                <span>{{ item.title }}</span>
              </div>
            </td>

            <td class="text-center">
              <div class="btn-group" role="group">
                <button class="btn btn-outline-secondary btn-sm" (click)="decrease(item)">-</button>
                <span class="px-2">{{ item.quantity }}</span>
                <button class="btn btn-outline-secondary btn-sm" (click)="increase(item)">+</button>
              </div>
            </td>

            <td class="text-end">
              {{ item.price | currency }}
            </td>

            <td class="text-end">
              {{ item.price * item.quantity | currency }}
            </td>

            <td class="text-end">
              <button class="btn btn-sm btn-danger" (click)="remove(item)">
                Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <div class="border rounded p-3" style="min-width:280px;">
        <div class="d-flex justify-content-between mb-2">
          <span>Total</span>
          <strong>{{ total | currency }}</strong>
        </div>

        <button class="btn btn-primary w-100 mt-2">
          Proceder al pago
        </button>
      </div>
    </div>
  </div>
</div>
